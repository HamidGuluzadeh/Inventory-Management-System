databaseChangeLog:
  - changeSet:
      id: 04-create-inventory-transactions-table
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: inventory_transactions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: transaction_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: notes
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: inventory_transactions
            baseColumnNames: product_id
            constraintName: fk_transactions_products
            referencedTableName: products
            referencedColumnNames: id
            onDelete: CASCADE