databaseChangeLog:
  - changeSet:
      id: 03-create-inventory-stocks-table-2026-10-08
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: inventory_stocks
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: VARCHAR(36)
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: current_quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: min_stock_level
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: inventory_stocks
            baseColumnNames: product_id
            constraintName: fk_inventory_stocks_products
            referencedTableName: products
            referencedColumnNames: id
            onDelete: CASCADE